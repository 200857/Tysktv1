name: Android Release APK (Signed)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore from secret
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./YouTubeTV/gradlew || true

      - name: Build Release APK (signed)
        working-directory: YouTubeTV
        run: |
          ./gradlew clean :app:assembleRelease             -PRELEASE_STORE_FILE=release.keystore             -PRELEASE_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'             -PRELEASE_KEY_ALIAS='${{ secrets.KEY_ALIAS }}'             -PRELEASE_KEY_PASSWORD='${{ secrets.KEY_ALIAS_PASSWORD }}'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtubetv-release-apk
          path: YouTubeTV/app/build/outputs/apk/release/app-release.apk
